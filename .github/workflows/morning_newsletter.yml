name: Auto Morning Newsletter 8:00 AM

on:
  schedule:
    # 01:00 UTC = 08:00 ICT (Giờ Việt Nam)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib numpy pandas reportlab beautifulsoup4 urllib3

      - name: Run Morning Newsletter Automation
        run: |
          TODAY=$(date +'%Y-%m-%d')
          cd ban-tin-sang
          python workflow/scripts/collect_vira_pdf.py --date $TODAY || true
          python workflow/scripts/collect_hsx_news.py --date $TODAY || true
          python workflow/scripts/collect_vietstock_rss.py --date $TODAY || true
          python workflow/scripts/draw_charts.py || true
          python workflow/scripts/export_vira_pdf.py --date $TODAY || true

      - name: Commit and Push Newsletter Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ban-tin-sang/output/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Daily morning newsletter $(date +'%Y-%m-%d')" && git push)
